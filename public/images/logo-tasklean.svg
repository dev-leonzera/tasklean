<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <!-- Gradientes para o ícone -->
  <defs>
    <linearGradient id="primaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="secondaryGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1d4ed8;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d97706;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Símbolo principal - Kanban board moderno -->
  <g transform="translate(10, 10)">
    <!-- Base do quadro Kanban -->
    <rect x="0" y="5" width="35" height="45" rx="4" ry="4" fill="url(#primaryGradient)" opacity="0.1"/>
    <rect x="0" y="5" width="35" height="45" rx="4" ry="4" fill="none" stroke="url(#primaryGradient)" stroke-width="2"/>
    
    <!-- Colunas do Kanban -->
    <rect x="3" y="10" width="9" height="35" rx="2" ry="2" fill="url(#secondaryGradient)" opacity="0.15"/>
    <rect x="13" y="10" width="9" height="35" rx="2" ry="2" fill="url(#accentGradient)" opacity="0.15"/>
    <rect x="23" y="10" width="9" height="35" rx="2" ry="2" fill="url(#primaryGradient)" opacity="0.15"/>
    
    <!-- Cards de tarefas -->
    <!-- Coluna 1 - To Do -->
    <rect x="4" y="12" width="7" height="4" rx="1" fill="url(#secondaryGradient)" opacity="0.8"/>
    <rect x="4" y="18" width="7" height="3" rx="0.5" fill="url(#secondaryGradient)" opacity="0.6"/>
    
    <!-- Coluna 2 - In Progress -->
    <rect x="14" y="12" width="7" height="4" rx="1" fill="url(#accentGradient)" opacity="0.8"/>
    <rect x="14" y="18" width="7" height="3" rx="0.5" fill="url(#accentGradient)" opacity="0.6"/>
    <rect x="14" y="23" width="7" height="3" rx="0.5" fill="url(#accentGradient)" opacity="0.4"/>
    
    <!-- Coluna 3 - Done -->
    <rect x="24" y="12" width="7" height="4" rx="1" fill="url(#primaryGradient)" opacity="0.8"/>
    <rect x="24" y="18" width="7" height="3" rx="0.5" fill="url(#primaryGradient)" opacity="0.6"/>
    <rect x="24" y="23" width="7" height="3" rx="0.5" fill="url(#primaryGradient)" opacity="0.4"/>
    <rect x="24" y="28" width="7" height="3" rx="0.5" fill="url(#primaryGradient)" opacity="0.3"/>
    
    <!-- Checkmarks na coluna Done -->
    <circle cx="26" cy="14" r="1" fill="white"/>
    <path d="M25.5 14 L26 14.5 L26.5 14" stroke="url(#primaryGradient)" stroke-width="0.8" fill="none" stroke-linecap="round"/>
    
    <circle cx="26" cy="20" r="1" fill="white"/>
    <path d="M25.5 20 L26 20.5 L26.5 20" stroke="url(#primaryGradient)" stroke-width="0.8" fill="none" stroke-linecap="round"/>
    
    <!-- Indicador de progresso -->
    <circle cx="17.5" cy="38" r="2.5" fill="url(#primaryGradient)"/>
    <path d="M16.5 38 L17.5 39 L18.5 38" stroke="white" stroke-width="0.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Texto "Tasklean" -->
  <g transform="translate(60, 15)">
    <!-- "Task" -->
    <text x="0" y="20" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="url(#primaryGradient)">
      Task
    </text>
    
    <!-- "lean" -->
    <text x="55" y="20" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="400" fill="#374151">
      lean
    </text>
    
    <!-- Linha decorativa -->
    <rect x="0" y="25" width="100" height="2" rx="1" fill="url(#primaryGradient)" opacity="0.3"/>
    
    <!-- Subtítulo -->
    <text x="0" y="40" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="400" fill="#6b7280">
      Gestão Ágil de Projetos
    </text>
  </g>

  <!-- Elementos decorativos modernos -->
  <g opacity="0.1">
    <!-- Círculos de fundo -->
    <circle cx="170" cy="15" r="8" fill="url(#primaryGradient)"/>
    <circle cx="185" cy="25" r="5" fill="url(#secondaryGradient)"/>
    <circle cx="175" cy="40" r="6" fill="url(#accentGradient)"/>
    
    <!-- Linhas de conexão -->
    <line x1="165" y1="15" x2="180" y2="25" stroke="url(#primaryGradient)" stroke-width="1" opacity="0.3"/>
    <line x1="180" y1="25" x2="175" y2="40" stroke="url(#secondaryGradient)" stroke-width="1" opacity="0.3"/>
  </g>
</svg>
